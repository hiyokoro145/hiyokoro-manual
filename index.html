<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>説明書一覧</title>
  <style>
    body { 
      margin:0; padding:20px; font-family:sans-serif; 
      background:#f5f5f5;
    }
    h1 { text-align:center; }
    .pdf-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: 1px solid #ddd;
      background: white;
    }
  </style>
</head>
<body>
  <h1>説明書</h1>
  
  <div class="pdf-container">
    <div>
      <h2>① 説明書1</h2>
      <iframe src="説明書1.pdf"></iframe>
    </div>
    
    <div>
      <h2>② 説明書2</h2>
      <iframe src="説明書2.pdf"></iframe>
    </div>
  </div>
</body>
</html>
